<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jupiter's Lab OS</title>
    <style>
        /* Jupiter's Lab Brand Palette */
        :root {
            --bg-color: #050505; /* Deep Black */
            --card-bg: #121214; /* Elevated Black for cards */
            --text-primary: #F8F8FA; /* Pearl White */
            --text-secondary: #8A8A93; /* Muted for less distraction */
            --accent-lavender: #B5A6F5; /* Digital Lavender */
            --accent-lavender-dim: rgba(181, 166, 245, 0.15); /* Soft lavender background for icons */
            --border-radius: 24px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        /* Branding Header */
        h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        p.subtitle {
            color: var(--accent-lavender);
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .subtitle a {
            color: inherit;
            text-decoration: none;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* Card Styling */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 24px;
            border: 1px solid rgba(248, 248, 250, 0.03); /* Extremely subtle pearl border */
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: scale(1.02);
            background-color: #1a1a1d;
            border-color: var(--accent-lavender-dim);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        /* Standardized Lavender Icons */
        .icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 16px;
            font-weight: bold;
            background-color: var(--accent-lavender-dim); 
            color: var(--accent-lavender); 
        }

        .card h2 {
            font-size: 20px;
            margin: 0;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* List Links */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        li {
            margin-bottom: 12px;
        }

        a.btn {
            display: block;
            text-decoration: none;
            color: var(--text-primary);
            background-color: rgba(248, 248, 250, 0.04);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        a.btn:hover {
            background-color: var(--accent-lavender-dim);
            color: var(--accent-lavender);
        }

        .drive-link::after {
            content: "↗";
            float: right;
            color: var(--text-secondary);
            transition: color 0.2s ease;
        }

        a.btn:hover .drive-link::after {
            color: var(--accent-lavender);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Jupiter's Lab</h1>
        <p class="subtitle"><a href="https://jupiterslab.com" target="_blank">jupiterslab.com</a></p>

        <div class="grid">
            
            <div class="card">
                <div class="card-header">
                    <div class="icon">◂</div>
                    <h2>Documentation</h2>
                </div>
                <ul>
                    <li><a href="https://drive.google.com/YOUR_SOP_FOLDER_LINK" target="_blank" class="btn drive-link">Standard Operating Procedures</a></li>
                    <li><a href="https://drive.google.com/YOUR_WELCOME_PACKET_LINK" target="_blank" class="btn drive-link">Welcome Packet Templates</a></li>
                    <li><a href="https://drive.google.com/YOUR_SOW_FOLDER_LINK" target="_blank" class="btn drive-link">SOWs & Agreements</a></li>
                </ul>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="icon">✦</div>
                    <h2>Active Clients</h2>
                </div>
                <ul>
                    <li><a href="#" target="_blank" class="btn drive-link">Client Alpha Folder</a></li>
                    <li><a href="#" target="_blank" class="btn drive-link">Client Beta Folder</a></li>
                    <li><a href="#" target="_blank" class="btn drive-link">Client Gamma Folder</a></li>
                </ul>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="icon">◈</div>
                    <h2>Finances</h2>
                </div>
                <ul>
                    <li><a href="https://docs.google.com/spreadsheets/YOUR_EXPENSE_SHEET" target="_blank" class="btn drive-link">Expense Tracker</a></li>
                    <li><a href="https://docs.google.com/spreadsheets/YOUR_INCOME_SHEET" target="_blank" class="btn drive-link">Income & Invoices</a></li>
                    <li><a href="https://docs.google.com/spreadsheets/YOUR_TAX_SHEET" target="_blank" class="btn drive-link">Tax Estimator</a></li>
                </ul>
            </div>

        </div>
    </div>

</body>
</html>
